<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F6F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>The Ledger</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"The Ledger","short_name":"Ledger","start_url":".","display":"standalone","background_color":"%23F2F6F0","theme_color":"%23F2F6F0"}'>
<style>
  :root{
    --paper:#F2F6F0; --band:#E3EDE0; --rule:#B9CDB6; --rule-soft:#D3E0D0;
    --ink:#172233; --ink-soft:#5B6B76; --red:#A8322A; --amber:#B4802A; --card:#fff;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans: ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .wrap{max-width:880px;margin:0 auto;padding:22px 16px 60px}

  .masthead{border-bottom:2px solid var(--ink);padding-bottom:11px;display:flex;
    align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px}
  h1{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}

  .lbl{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .fig{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;font-weight:500}
  .muted{color:var(--ink-soft)}
  .red{color:var(--red)}

  nav{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:20px;
    overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    padding:13px 13px;background:none;border:none;border-bottom:2px solid transparent;
    color:var(--ink-soft);white-space:nowrap;cursor:pointer;min-height:44px}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:17px;margin-bottom:16px}
  .card.flush{padding:0;overflow:hidden}
  .card.flush .head{padding:16px 17px 9px}
  .card.flush .foot{padding:13px 17px;border-top:1px solid var(--rule)}

  .row{padding:11px 17px}
  .row:nth-child(odd){background:var(--band)}

  input,select,button{font-family:inherit}
  input,select{font-size:16px;color:var(--ink);background:var(--paper);
    border:1px solid var(--rule);border-radius:3px;padding:10px;width:100%;min-width:0;min-height:44px}
  input[inputmode="decimal"],input[type=date]{font-family:var(--mono);font-variant-numeric:tabular-nums}
  input.num{text-align:right}
  input::placeholder{color:#9AA8A2}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  input.bare{background:transparent;border-color:transparent;padding:8px 6px}

  .btn{font-size:14px;font-weight:600;padding:11px 15px;border-radius:3px;cursor:pointer;
    background:var(--ink);color:var(--paper);border:1px solid var(--ink);min-height:44px}
  .btn.quiet{background:transparent;color:var(--ink);border-color:var(--rule)}
  .btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
  .btn:disabled{opacity:.4}
  .x{background:none;border:none;color:var(--ink-soft);font-size:20px;line-height:1;
    cursor:pointer;padding:8px;min-width:36px}

  .grid{display:grid;gap:8px}
  .g-amt{grid-template-columns:118px 1fr}
  .g-note{grid-template-columns:1fr 148px}
  .g-bill{grid-template-columns:1fr 1fr auto}
  .g-goal{grid-template-columns:1fr 118px auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:16px}
  .stats .card{margin:0;padding:13px}
  @media(max-width:520px){
    .g-note,.g-bill,.g-goal{grid-template-columns:1fr}
    .g-note>*:nth-child(2){max-width:180px}
  }

  .strip{position:relative;height:42px;border:1px solid var(--rule);border-radius:2px;display:flex;overflow:hidden;
    background:repeating-linear-gradient(90deg,var(--band) 0 1px,var(--paper) 1px 14px)}
  .strip i{display:block;height:100%;border-right:1px solid var(--paper);transition:width .26s ease}
  .notch{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink)}
  .keys{display:flex;flex-wrap:wrap;gap:6px 15px;margin-top:10px}
  .keys span{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft)}
  .dot{width:8px;height:8px;border-radius:1px}

  .monthnav{display:flex;align-items:center;justify-content:space-between}
  .monthnav b{font-size:14px;font-weight:700;letter-spacing:-.01em}
  .monthnav button{font-size:24px;color:var(--ink)}

  .bar{height:6px;background:var(--rule-soft);border-radius:1px;overflow:hidden}
  .bar i{display:block;height:100%;transition:width .26s ease}

  .between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .hero{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(38px,12vw,54px);
    font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:6px 0 3px}
  footer{margin-top:34px;padding-top:15px;border-top:1px solid var(--rule);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;font-size:11px}
  footer button{background:none;border:none;color:var(--ink-soft);font-size:11px;
    text-decoration:underline;cursor:pointer;padding:6px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="masthead"><h1>The Ledger</h1><div class="lbl" id="mast"></div></div>
  <nav id="nav"></nav>
  <div id="app"></div>
  <footer>
    <span class="muted" id="savenote">Saved on this device.</span>
    <span>
      <button data-act="export">Export backup</button>
      <button data-act="import">Restore</button>
      <button data-act="reset">Clear all</button>
    </span>
  </footer>
</div>
<input type="file" id="file" accept="application/json" hidden>

<script>
(function(){
"use strict";
var KEY="ledger-v1";
var COLORS=["#2F5D50","#4A6FA5","#8C5A9E","#B4802A","#3F7A6B","#A8322A","#6B7A3F","#7A5C3F"];
var CAD={weekly:["Weekly",52/12],monthly:["Monthly",1],quarterly:["Quarterly",1/3],yearly:["Yearly",1/12]};

/* ---------- utils ---------- */
function uid(){return Math.random().toString(36).slice(2,10)}
function money(n){n=Number(n)||0;var big=Math.abs(n)>=1000;
  return n.toLocaleString("en-US",{style:"currency",currency:"USD",
    minimumFractionDigits:big?0:2,maximumFractionDigits:big?0:2})}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function iso(d){d=d||new Date();var m=d.getMonth()+1,day=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day}
function parse(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function shortDate(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}
function daysUntil(d){var t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function nextDue(isoStr,cad){
  var t=new Date();t.setHours(0,0,0,0);var d=parse(isoStr),g=0;
  while(d<t&&g++<600){
    if(cad==="weekly")d.setDate(d.getDate()+7);
    else if(cad==="monthly")d.setMonth(d.getMonth()+1);
    else if(cad==="quarterly")d.setMonth(d.getMonth()+3);
    else d.setFullYear(d.getFullYear()+1);
  } return d;
}

/* ---------- state ---------- */
function seed(){return{v:1,income:0,categories:[
    {id:uid(),name:"Rent & utilities",budget:0},{id:uid(),name:"Groceries",budget:0},
    {id:uid(),name:"Eating out",budget:0},{id:uid(),name:"Transit",budget:0},
    {id:uid(),name:"Fun",budget:0}],transactions:[],bills:[],goals:[]}}

var S,tab="overview",canSave=true;
try{var raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):seed();}
catch(e){S=seed();canSave=false;}
if(!S||!S.categories)S=seed();

function save(){
  if(!canSave)return;
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){canSave=false;document.getElementById("savenote").innerHTML=
    '<span class="red">Couldn\u2019t save \u2014 storage is blocked or full.</span>'}
}

/* ---------- derived ---------- */
function curMK(){return iso().slice(0,7)}
function shiftMK(mk,n){var d=parse(mk+"-01");d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)}
function mkLabel(mk){return parse(mk+"-01").toLocaleDateString("en-US",{month:"long",year:"numeric"})}
function lastDay(mk){var d=parse(mk+"-01");d.setMonth(d.getMonth()+1);d.setDate(0);return iso(d)}

function derive(mk){
  var now=new Date(); mk=mk||curMK();
  var tx=S.transactions.filter(function(t){return t.date.slice(0,7)===mk});
  var by={},spent=0;
  tx.forEach(function(t){by[t.categoryId]=(by[t.categoryId]||0)+Number(t.amount);spent+=Number(t.amount)});
  var budget=S.categories.reduce(function(a,c){return a+(Number(c.budget)||0)},0);
  var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  var left=budget-spent, daysLeft=dim-now.getDate()+1;
  var bills=S.bills.map(function(b){var o={};for(var k in b)o[k]=b[k];o.next=nextDue(b.due,b.cadence);return o})
                   .sort(function(a,b){return a.next-b.next});
  return{now:now,by:by,spent:spent,budget:budget,left:left,daysLeft:daysLeft,tx:tx,mk:mk,past:mk!==curMK(),
    progress:now.getDate()/dim,perDay:daysLeft>0?left/daysLeft:left,
    bills:bills,soon:bills.filter(function(b){return daysUntil(b.next)<=7}),
    billsMonthly:S.bills.reduce(function(a,b){return a+(Number(b.amount)||0)*CAD[b.cadence][1]},0)};
}
function catName(id){var c=S.categories.filter(function(c){return c.id===id})[0];return c?c.name:"Uncategorized"}

/* ---------- views ---------- */
function strip(d){
  var segs=S.categories.map(function(c,i){return{n:c.name,s:d.by[c.id]||0,c:COLORS[i%COLORS.length]}})
    .filter(function(x){return x.s>0});
  var denom=Math.max(d.budget,segs.reduce(function(a,x){return a+x.s},0),1);
  var pct=Math.min(d.progress*100,100);
  return '<div class="strip">'+segs.map(function(x){
      return '<i style="width:'+(x.s/denom*100)+'%;background:'+x.c+'" title="'+esc(x.n)+'"></i>'}).join("")+
    '<div class="notch" style="left:'+pct+'%"></div></div>'+
    '<div class="keys">'+(segs.length?segs.map(function(x){
      return '<span><i class="dot" style="background:'+x.c+'"></i>'+esc(x.n)+
             ' <b class="fig" style="font-size:11px">'+money(x.s)+'</b></span>'}).join(""):
      '<span>Nothing logged yet this month. The marker shows how far into the month you are.</span>')+'</div>';
}

function overview(d){
  var h="";
  if(d.budget===0){
    h+='<div class="card"><div class="lbl">Start here</div>'+
       '<p style="font-size:15px;line-height:1.5;margin:10px 0 15px;max-width:440px">Set a monthly amount for '+
       'each envelope and this becomes the number you check every morning: what\u2019s safe to spend today.</p>'+
       '<button class="btn" data-act="go" data-tab="envelopes">Set your budget</button></div>';
  }else{
    h+='<div class="card" style="padding:22px"><div class="lbl">Safe to spend today</div>'+
       '<div class="hero'+(d.perDay<0?' red':'')+'">'+money(Math.max(d.perDay,0))+'</div>'+
       '<div style="font-size:13px" class="'+(d.left<0?'red':'muted')+'">'+
       (d.left<0? "You\u2019re "+money(Math.abs(d.left))+" over budget with "+d.daysLeft+" days to go."
                : money(d.left)+" left, spread across the "+d.daysLeft+" days remaining.")+
       '</div></div>';
  }
  var ahead=d.budget>0&&d.spent/d.budget>d.progress;
  h+='<div class="card"><div class="between" style="margin-bottom:11px">'+
     '<span class="lbl">Where the month has gone</span>'+
     '<span style="font-size:11px" class="'+(ahead?'red':'muted')+'">'+(ahead?"Ahead of pace":"On pace")+'</span>'+
     '</div>'+strip(d)+'</div>';

  h+='<div class="stats">'+
     stat("Spent this month",money(d.spent),"")+
     stat("Budget remaining",money(d.left),d.left<0?"red":"")+
     stat("Bills, monthly cost",money(d.billsMonthly),"")+'</div>';

  if(d.soon.length){
    h+='<div class="card"><div class="lbl" style="margin-bottom:10px">Due in the next 7 days</div>'+
      d.soon.map(function(b){var n=daysUntil(b.next);
        return '<div class="between" style="padding:8px 0;border-top:1px solid var(--rule-soft)">'+
          '<span style="font-size:14px">'+esc(b.name)+'</span><span>'+
          '<span style="font-size:12px;margin-right:12px" class="'+(n<=2?'red':'muted')+'">'+
          (n===0?"today":n===1?"tomorrow":"in "+n+" days")+'</span>'+
          '<b class="fig" style="font-size:14px">'+money(b.amount)+'</b></span></div>'}).join("")+'</div>';
  }
  if(S.goals.length){
    h+='<div class="card"><div class="lbl" style="margin-bottom:12px">Goals</div>'+
      S.goals.map(function(g){return goalBar(g,true)}).join("")+'</div>';
  }
  return h;
}
function stat(l,v,cls){return '<div class="card"><div class="lbl">'+l+
  '</div><div class="fig '+cls+'" style="font-size:22px;margin-top:5px">'+v+'</div></div>'}

function spending(d){
  var opts=S.categories.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("");
  var h='<div class="card" style="padding:9px 11px"><div class="monthnav">'+
    '<button class="x" data-act="mk" data-n="-1" aria-label="Previous month">\u2039</button>'+
    '<b>'+mkLabel(d.mk)+'</b>'+
    '<button class="x" data-act="mk" data-n="1" aria-label="Next month"'+
      (d.past?"":" disabled style=\"opacity:.25\"")+'>\u203a</button></div></div>';

  h+='<div class="card"><div class="lbl" style="margin-bottom:11px">Log a purchase</div>'+
    '<div class="grid g-amt" style="margin-bottom:8px">'+
      '<input id="t-amt" inputmode="decimal" class="num" placeholder="0.00">'+
      '<select id="t-cat">'+opts+'</select></div>'+
    '<div class="grid g-note" style="margin-bottom:12px">'+
      '<input id="t-note" placeholder="What was it for?">'+
      '<input id="t-date" type="date" value="'+(d.past?lastDay(d.mk):iso())+'"></div>'+
    '<button class="btn" data-act="add-tx">Add to ledger</button></div>';

  h+='<div class="card flush"><div class="head"><span class="lbl">By envelope, this month</span></div>'+
    S.categories.map(function(c,i){
      var s=d.by[c.id]||0,b=Number(c.budget)||0,over=b>0&&s>b,p=b>0?Math.min(s/b,1):0;
      return '<div class="row"><div class="between" style="margin-bottom:6px">'+
        '<span style="font-size:14px">'+esc(c.name)+'</span><span>'+
        '<b class="fig '+(over?'red':'')+'" style="font-size:13px">'+money(s)+'</b>'+
        '<span class="fig muted" style="font-size:12px"> / '+(b>0?money(b):"\u2014")+'</span></span></div>'+
        '<div class="bar"><i style="width:'+p*100+'%;background:'+(over?"var(--red)":COLORS[i%COLORS.length])+'"></i></div></div>'
    }).join("")+'</div>';

  h+='<div class="card flush"><div class="head"><span class="lbl">Entries \u00b7 '+mkLabel(d.mk)+'</span></div>';
  if(!d.tx.length){
    h+='<div style="padding:0 17px 17px;font-size:13px" class="muted">'+
      (d.past?"Nothing was logged this month.":"Every purchase you log here moves the safe-to-spend number on the overview.")+'</div>';
  }else{
    h+=d.tx.map(function(t){
      return '<div class="row" style="display:flex;align-items:center;gap:10px">'+
        '<span class="fig muted" style="font-size:11px;width:52px;flex:none">'+shortDate(parse(t.date))+'</span>'+
        '<span style="font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+
        esc(t.note||catName(t.categoryId))+(t.note?'<span class="muted" style="font-size:11px"> \u00b7 '+esc(catName(t.categoryId))+'</span>':"")+
        '</span><b class="fig" style="font-size:13px">'+money(t.amount)+'</b>'+
        '<button class="x" data-act="del-tx" data-id="'+t.id+'" aria-label="Remove entry">\u00d7</button></div>'
    }).join("");
  }
  return h+'</div>';
}

function envelopes(d){
  var inc=Number(S.income)||0, un=inc-d.budget;
  var h='<div class="card"><div class="lbl" style="margin-bottom:9px">Monthly income</div>'+
    '<div style="display:flex;gap:10px;align-items:center">'+
    '<input id="income" inputmode="decimal" class="num" data-live="income" style="max-width:160px" '+
    'value="'+(inc||"")+'" placeholder="0">'+
    '<span style="font-size:13px" class="muted">what lands in your account each month</span></div></div>';

  h+='<div class="card"'+(un<0?' style="background:#FDF3F2"':'')+'><div class="between">'+
    '<div><div class="lbl">'+(un<0?"Over-allocated":"Still unassigned")+'</div>'+
    '<div class="fig '+(un<0?'red':'')+'" style="font-size:29px;margin-top:5px" id="unalloc">'+money(Math.abs(un))+'</div></div>'+
    '<div style="text-align:right"><div style="font-size:12px" class="muted" id="allocline">'+
    money(d.budget)+' assigned of '+money(inc)+'</div>'+
    (un<0?'<div style="font-size:12px;margin-top:4px" class="red">Trim an envelope or raise your income figure.</div>':"")+
    '</div></div></div>';

  h+='<div class="card flush"><div class="head"><span class="lbl">Envelopes</span></div>'+
    S.categories.map(function(c){
      return '<div class="row" style="display:flex;gap:8px;align-items:center">'+
        '<input class="bare" data-live="name" data-id="'+c.id+'" value="'+esc(c.name)+'" style="flex:1">'+
        '<input inputmode="decimal" class="num" data-live="budget" data-id="'+c.id+'" '+
        'style="max-width:104px" value="'+(Number(c.budget)||"")+'" placeholder="0">'+
        '<button class="x" data-act="del-cat" data-id="'+c.id+'" aria-label="Delete envelope">\u00d7</button></div>'
    }).join("")+
    '<div class="foot" style="display:flex;gap:8px">'+
    '<input id="new-cat" placeholder="New envelope, e.g. Books">'+
    '<button class="btn quiet" data-act="add-cat">Add</button></div></div>';
  return h;
}

function bills(d){
  var h='<div class="card"><div class="between">'+
    '<span class="lbl">What subscriptions cost you per month</span>'+
    '<b class="fig" style="font-size:25px">'+money(d.billsMonthly)+'</b></div>'+
    '<div style="font-size:12px;margin-top:6px" class="muted">Yearly and weekly charges are converted to their monthly equivalent, so this is the real run rate.</div></div>';

  h+='<div class="card flush"><div class="head"><span class="lbl">Recurring</span></div>';
  if(!d.bills.length){
    h+='<div style="padding:0 17px 17px;font-size:13px" class="muted">Add the charges that renew on their own. They\u2019ll show up on the overview a week before they hit.</div>';
  }else{
    h+=d.bills.map(function(b){var n=daysUntil(b.next);
      return '<div class="row" style="display:flex;align-items:center;gap:10px">'+
        '<div style="flex:1;min-width:0"><div style="font-size:14px">'+esc(b.name)+'</div>'+
        '<div style="font-size:11px;margin-top:2px" class="'+(n<=7?'red':'muted')+'">'+
        CAD[b.cadence][0]+' \u00b7 next '+shortDate(b.next)+'</div></div>'+
        '<b class="fig" style="font-size:14px">'+money(b.amount)+'</b>'+
        '<button class="x" data-act="del-bill" data-id="'+b.id+'" aria-label="Remove bill">\u00d7</button></div>'
    }).join("");
  }
  h+='<div class="foot"><div class="grid g-note" style="margin-bottom:8px">'+
    '<input id="b-name" placeholder="Name, e.g. Spotify">'+
    '<input id="b-amt" inputmode="decimal" class="num" placeholder="0.00"></div>'+
    '<div class="grid g-bill">'+
    '<select id="b-cad">'+Object.keys(CAD).map(function(k){
      return '<option value="'+k+'"'+(k==="monthly"?" selected":"")+'>'+CAD[k][0]+'</option>'}).join("")+'</select>'+
    '<input id="b-due" type="date" value="'+iso()+'">'+
    '<button class="btn quiet" data-act="add-bill">Add</button></div></div></div>';
  return h;
}

function goalBar(g,compact){
  var saved=Number(g.saved)||0,target=Number(g.target)||0;
  var p=target>0?Math.min(saved/target,1):0, done=target>0&&saved>=target;
  return '<div style="padding-bottom:'+(compact?12:6)+'px">'+
    '<div class="between" style="margin-bottom:6px"><span style="font-size:14px">'+esc(g.name)+'</span>'+
    '<span><b class="fig" style="font-size:13px'+(done?';color:var(--amber)':'')+'">'+money(saved)+'</b>'+
    '<span class="fig muted" style="font-size:12px"> / '+money(target)+'</span></span></div>'+
    '<div class="bar" style="height:8px"><i style="width:'+p*100+'%;background:'+(done?"var(--amber)":"#3F7A6B")+'"></i></div>'+
    '<div style="font-size:11px;margin-top:5px" class="muted">'+
    (done?"Funded.":money(Math.max(target-saved,0))+" to go")+'</div>'+
    (compact?"":'<div style="display:flex;gap:8px;margin-top:10px">'+
      '<input inputmode="decimal" class="num" id="c-'+g.id+'" style="max-width:110px" placeholder="0.00">'+
      '<button class="btn quiet" data-act="fund" data-id="'+g.id+'">Put money in</button></div>')+'</div>';
}

function goals(){
  var h='<div class="card"><div class="lbl" style="margin-bottom:12px">Saving toward</div>';
  if(!S.goals.length){
    h+='<div style="font-size:13px" class="muted">A goal is just a number with a name on it. Add one below and start feeding it.</div>';
  }else{
    h+=S.goals.map(function(g,i){
      return '<div style="'+(i?'border-top:1px solid var(--rule-soft);padding-top:14px;':'')+'margin-top:'+(i?'14px':'0')+'">'+
        '<div style="display:flex;justify-content:flex-end;margin-bottom:-16px">'+
        '<button class="x" data-act="del-goal" data-id="'+g.id+'" aria-label="Delete goal">\u00d7</button></div>'+
        goalBar(g,false)+'</div>'}).join("");
  }
  h+='</div><div class="card"><div class="lbl" style="margin-bottom:9px">New goal</div>'+
    '<div class="grid g-goal"><input id="g-name" placeholder="e.g. Emergency fund">'+
    '<input id="g-target" inputmode="decimal" class="num" placeholder="Target">'+
    '<button class="btn quiet" data-act="add-goal">Add</button></div></div>';
  return h;
}

/* ---------- render ---------- */
var TABS=[["overview","Overview"],["spending","Spending"],["envelopes","Envelopes"],["bills","Bills"],["goals","Goals"]];
var viewMK=null;
function render(){
  if(!viewMK)viewMK=curMK();
  var d=derive();
  document.getElementById("mast").textContent=
    d.now.toLocaleDateString("en-US",{month:"long"})+" "+d.now.getFullYear()+" \u00b7 "+d.daysLeft+" days left";
  document.getElementById("nav").innerHTML=TABS.map(function(t){
    return '<button role="tab" aria-selected="'+(tab===t[0])+'" data-act="go" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("");
  document.getElementById("app").innerHTML=
    tab==="overview"?overview(d):tab==="spending"?spending(derive(viewMK)):
    tab==="envelopes"?envelopes(d):tab==="bills"?bills(d):goals();
}

/* ---------- events ---------- */
function val(id){var e=document.getElementById(id);return e?e.value:""}
function num(id){return parseFloat(val(id))||0}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el)return;
  var a=el.getAttribute("data-act"), id=el.getAttribute("data-id");

  if(a==="go"){tab=el.getAttribute("data-tab");viewMK=curMK();render();return}
  if(a==="mk"){
    var nx=shiftMK(viewMK,+el.getAttribute("data-n"));
    if(nx<=curMK())viewMK=nx;
    render();return}

  if(a==="add-tx"){var amt=num("t-amt");if(!amt)return;
    S.transactions.unshift({id:uid(),amount:amt,categoryId:val("t-cat"),note:val("t-note").trim(),date:val("t-date")||iso()});}
  else if(a==="del-tx"){S.transactions=S.transactions.filter(function(t){return t.id!==id})}
  else if(a==="add-cat"){var n=val("new-cat").trim();if(!n)return;
    S.categories.push({id:uid(),name:n,budget:0});}
  else if(a==="del-cat"){S.categories=S.categories.filter(function(c){return c.id!==id});
    S.transactions=S.transactions.filter(function(t){return t.categoryId!==id});}
  else if(a==="add-bill"){var bn=val("b-name").trim(),ba=num("b-amt");if(!bn||!ba)return;
    S.bills.push({id:uid(),name:bn,amount:ba,cadence:val("b-cad"),due:val("b-due")||iso()});}
  else if(a==="del-bill"){S.bills=S.bills.filter(function(b){return b.id!==id})}
  else if(a==="add-goal"){var gn=val("g-name").trim(),gt=num("g-target");if(!gn||!gt)return;
    S.goals.push({id:uid(),name:gn,target:gt,saved:0});}
  else if(a==="del-goal"){S.goals=S.goals.filter(function(g){return g.id!==id})}
  else if(a==="fund"){var add=num("c-"+id);if(!add)return;
    S.goals=S.goals.map(function(g){if(g.id===id)g.saved=(Number(g.saved)||0)+add;return g});}
  else if(a==="export"){
    var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    var u=URL.createObjectURL(blob),link=document.createElement("a");
    link.href=u;link.download="ledger-backup-"+iso()+".json";link.click();
    setTimeout(function(){URL.revokeObjectURL(u)},1000);return;}
  else if(a==="import"){document.getElementById("file").click();return}
  else if(a==="reset"){
    if(el.getAttribute("data-armed")){S=seed();save();render();return}
    el.setAttribute("data-armed","1");el.textContent="Tap again to erase";
    el.style.color="var(--red)";
    setTimeout(function(){el.removeAttribute("data-armed");el.textContent="Clear all";el.style.color=""},4000);
    return;}
  else return;
  save();render();
});

/* live-edit fields: update state without re-rendering, so focus is kept */
document.addEventListener("input",function(e){
  var el=e.target, kind=el.getAttribute&&el.getAttribute("data-live"); if(!kind)return;
  var id=el.getAttribute("data-id");
  if(kind==="income")S.income=parseFloat(el.value)||0;
  else if(kind==="budget")S.categories=S.categories.map(function(c){
    if(c.id===id)c.budget=parseFloat(el.value)||0;return c});
  else if(kind==="name")S.categories=S.categories.map(function(c){
    if(c.id===id)c.name=el.value;return c});
  save();
  var d=derive(),inc=Number(S.income)||0,un=inc-d.budget,u=document.getElementById("unalloc"),
      a=document.getElementById("allocline");
  if(u){u.textContent=money(Math.abs(un));u.className="fig"+(un<0?" red":"")}
  if(a)a.textContent=money(d.budget)+" assigned of "+money(inc);
});

document.getElementById("file").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var o=JSON.parse(r.result);
      if(!o||!o.categories)throw 0;
      S=o;save();render();
    }catch(err){alert("That file isn\u2019t a Ledger backup.")}
  };
  r.readAsText(f); e.target.value="";
});

/* A home-screen app is frozen, not reloaded. Re-render when it wakes so the
   date, days-left and month rollover are never stale. */
var seenDay=iso();
function checkRollover(){
  var today=iso();
  if(today===seenDay)return;
  var monthChanged=today.slice(0,7)!==seenDay.slice(0,7);
  seenDay=today;
  if(monthChanged)viewMK=curMK();
  render();
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)checkRollover()});
window.addEventListener("focus",checkRollover);
setInterval(checkRollover,60000);

if(!canSave)document.getElementById("savenote").innerHTML=
  '<span class="red">Storage is blocked here \u2014 entries won\u2019t survive a reload.</span>';
render();
})();
</script>
